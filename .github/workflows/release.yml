# 推一个形如 v0.1.1 的 tag 就会自动触发：
#   git tag v0.1.1
#   git push origin v0.1.1
#
# 分两段跑，避免 Windows/Mac 两边并行任务抢着"创建 Release"导致出现两个重复 draft：
#   1. create-release：先单独跑一次，把这个 tag 对应的 Release 建好（如果还没有的话）
#   2. release（matrix）：等第 1 步跑完了，Windows/Mac 才开始并行打包，
#      这时候 Release 已经存在了，两边只是各自把安装包传上去，不会再抢着建。

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # 创建/更新 Release、上传安装包都要用到这个权限

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release if it doesn't exist yet
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release 已经存在，跳过创建"
          else
            gh release create "${{ github.ref_name }}" --draft --title "${{ github.ref_name }}" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Build and publish
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # electron-builder 认的是这个变量名，不是 GITHUB_TOKEN
